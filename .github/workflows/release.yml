name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure and verify npm authentication
        # changesets/action passes NPM_TOKEN only as an env var, which npm
        # does not read — without an explicit auth line the publish runs
        # anonymous and the registry answers E404 (WP008.5 run evidence).
        # Fails fast and loudly when the secret is missing/invalid, before
        # any build or publish (spec §5.5.4).
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN repository secret is missing or empty - publishing would fail. Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          nix develop --command npm whoami --registry https://registry.npmjs.org/

      - name: Install dependencies (frozen lockfile)
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Verify before release
        run: nix develop --command pnpm verify

      - name: Create release PR or publish
        # Requires (WP008.2R run #17 root cause, logged 2026-11-26):
        # 1. Repo setting: Settings → Actions → General → Workflow
        #    permissions → "Allow GitHub Actions to create and approve
        #    pull requests" (else 403 creating the Version PR).
        # 2. `NPM_TOKEN` repository secret (publish path only; Version-PR
        #    path works without it). Auth is written to ~/.npmrc by the
        #    "Configure and verify npm authentication" step above.
        uses: changesets/action@v2
        with:
          # action v2 renamed these inputs (v1 used `publish`/`version`);
          # requires @changesets/cli v3 — see WP008.2R completion report.
          publish-script: nix develop --command pnpm release
          version-script: nix develop --command pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
