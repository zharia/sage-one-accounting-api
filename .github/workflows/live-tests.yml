name: Live Sage API tests

# Verification level V5 — separate, explicitly configured stage (M008 WP008.3).
# Never triggered by push/PR; requires repository secrets. Ordinary CI
# (ci.yml) runs only the non-live suites and needs no Sage credentials.

on:
  workflow_dispatch:

jobs:
  live:
    name: Live smoke (V5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Require live credentials
        env:
          SAGE_USERNAME: ${{ secrets.SAGE_USERNAME }}
          SAGE_PASSWORD: ${{ secrets.SAGE_PASSWORD }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
        run: |
          if [ -z "$SAGE_USERNAME" ] || [ -z "$SAGE_PASSWORD" ] || [ -z "$SAGE_API_KEY" ]; then
            echo "::error::Configure SAGE_USERNAME, SAGE_PASSWORD and SAGE_API_KEY repository secrets before dispatching live tests."
            exit 1
          fi

      - name: Install dependencies (frozen lockfile)
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Run live test stage
        env:
          SAGE_USERNAME: ${{ secrets.SAGE_USERNAME }}
          SAGE_PASSWORD: ${{ secrets.SAGE_PASSWORD }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
          SAGE_COMPANY_ID: ${{ secrets.SAGE_COMPANY_ID }}
        run: nix develop --command pnpm test:live
